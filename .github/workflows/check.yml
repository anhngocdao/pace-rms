name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC, catches a Python or runner drift

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests and quick golden numbers
        run: python run.py test
      - name: Quick build
        run: python run.py build --quick

  full:
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full golden row
        run: python run.py test
        env:
          PACE_FULL: "1"
      - name: Full build
        run: python run.py build
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.sha }}
          path: |
            out/run.json
            out/backtest.csv
          retention-days: 30
